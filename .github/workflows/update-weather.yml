name: Update SEA weather cache

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "weather/catalog.json"
      - "scripts/update_weather.py"
      - ".github/workflows/update-weather.yml"

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh cached weather
        shell: bash
        run: |
          if python scripts/update_weather.py; then
            exit 0
          fi
          echo "Full weather refresh failed. Waiting 60 seconds before one clean retry..."
          sleep 60
          python scripts/update_weather.py

      - name: Commit changed cache files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather/data
          if git diff --cached --quiet; then
            echo "Weather cache is unchanged."
            exit 0
          fi
          git commit -m "Refresh SEA weather cache"
          git pull --rebase origin main
          git push
