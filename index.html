<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Window">
  <title>Window</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .room{padding:0;background:linear-gradient(90deg,#1b1d20,#2b2e31 50%,#1a1c1f)}
    .room-wall{position:absolute;inset:5vh 3vw 4vh;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#2f3235 0%,#282b2e 72%,#202326 100%);box-shadow:inset 0 1px rgba(255,255,255,.03),inset 0 -34px 70px rgba(0,0,0,.18)}
    .room-track{--sill-line:clamp(54px,calc(50% - min(37vh,380px)),16vh);position:absolute;inset:0;display:grid;grid-template-columns:minmax(260px,1fr) auto minmax(270px,1fr);align-items:center;gap:clamp(24px,3vw,56px);padding:9vh clamp(22px,3vw,54px) 5vh}
    .room-zone{position:relative;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}.main-zone{z-index:5}
    .room-light{z-index:2;top:-4vh!important;width:min(108vw,1200px)!important;height:min(70vh,760px)!important;background:radial-gradient(ellipse at 50% 6%,rgba(255,215,151,.34),rgba(255,177,91,.17) 29%,rgba(255,150,60,.06) 50%,transparent 75%)!important}
    .ceiling-lamp{z-index:18!important;left:50%;top:-10vh;height:82px}.lamp-cord{height:18px!important}.lamp-socket{top:22px!important}.lamp-shade{top:35px!important}
    .window-recess{position:relative;z-index:5;padding:21px 22px 27px;border-radius:30px;background:linear-gradient(145deg,#383c40,#1b1f23 72%);box-shadow:inset 18px 18px 28px rgba(0,0,0,.3),inset -7px -7px 14px rgba(255,255,255,.025),0 12px 26px rgba(0,0,0,.22)}
    .window-recess:before{content:"";position:absolute;inset:8px 9px 12px;border-radius:23px;border:1px solid rgba(255,255,255,.04);pointer-events:none}.window-shell{z-index:1;overflow:visible}.window-shell:before{content:"";position:absolute;z-index:18;left:-12px;right:-12px;top:-12px;height:8px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#3b4147,#1b2025);box-shadow:0 2px 6px rgba(0,0,0,.35)}.window-shell:after{left:-24px!important;right:-24px!important;bottom:-20px!important;height:20px!important;border-radius:3px 3px 10px 10px!important;background:linear-gradient(180deg,#343a40,#161b1f)!important;box-shadow:0 10px 18px rgba(0,0,0,.3)!important}
    .window-blinds{position:absolute;z-index:24;left:7px;right:7px;top:6px;height:calc(100% - 12px);border:0;background:none;padding:0;cursor:pointer;pointer-events:none}.blind-headrail{position:absolute;z-index:3;left:0;right:0;top:0;height:32px;border-radius:10px 10px 5px 5px;background:linear-gradient(180deg,#e4ddd2 0%,#bcb2a4 52%,#91887d 100%);box-shadow:0 6px 12px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.6),inset 0 -2px rgba(72,64,57,.25);pointer-events:auto}.blind-headrail:before{content:"";position:absolute;left:13px;right:13px;top:8px;height:10px;border-radius:6px;background:linear-gradient(180deg,#b1a89d,#888076);box-shadow:inset 0 1px rgba(255,255,255,.2)}.blind-headrail:after{content:"";position:absolute;right:12px;top:10px;width:8px;height:8px;border-radius:50%;background:#746d65;box-shadow:0 0 0 2px rgba(255,255,255,.14)}
    .blind-sheet{position:absolute;left:13px;right:13px;top:28px;height:0;border-radius:0 0 8px 8px;background:repeating-linear-gradient(180deg,#ded8cf 0 9px,#c4bcb1 9px 11px,#e8e2d9 11px 20px);box-shadow:0 10px 18px rgba(0,0,0,.2);overflow:hidden;transition:height .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}.blind-sheet:after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(180deg,#b5ada1,#8f877c);box-shadow:0 -1px rgba(255,255,255,.2),0 2px 4px rgba(0,0,0,.22)}.blind-chain{position:absolute;z-index:4;right:12px;top:31px;width:2px;height:48px;background:repeating-linear-gradient(180deg,#aba397 0 2px,transparent 2px 5px);opacity:.82;pointer-events:auto}.blind-chain:after{content:"";position:absolute;left:-3px;bottom:-6px;width:8px;height:8px;border:1px solid #9c9488;border-radius:50%}
    .is-day[data-weather="clear"] .blind-sheet{height:24%}.is-day[data-weather="partly-cloudy"] .blind-sheet{height:14%}.is-day[data-weather="cloudy"] .blind-sheet{height:6%}.is-night .blind-sheet,.app[data-weather="rain"] .blind-sheet,.app[data-weather="heavy-rain"] .blind-sheet,.app[data-weather="storm"] .blind-sheet,.app[data-weather="drizzle"] .blind-sheet,.app[data-weather="fog"] .blind-sheet{height:0}.app.blinds-manual .blind-sheet{height:var(--blind-drop)!important}.window-bars .bar-v{left:calc(50% - 5px);top:0;bottom:0;width:10px}.bar-h{display:none!important}

    .celestial-body{position:absolute;z-index:1;width:46px;height:46px;border-radius:50%;pointer-events:none;opacity:0;transition:left 1.2s ease,top 1.2s ease,background .8s ease,box-shadow .8s ease,opacity .8s ease;overflow:hidden}
    .is-day .celestial-body{opacity:.92;background:#fff2b0;box-shadow:0 0 18px 8px rgba(255,225,137,.25),0 0 58px 22px rgba(255,207,99,.14)}
    .is-morning .celestial-body{left:14%;top:22%;background:#ffd884;box-shadow:0 0 20px 9px rgba(255,213,118,.28),0 0 72px 28px rgba(255,187,79,.14)}
    .is-midday .celestial-body{left:47%;top:8%;background:#fffbd9;box-shadow:0 0 20px 10px rgba(255,248,205,.32),0 0 82px 32px rgba(255,232,147,.18)}
    .is-afternoon .celestial-body{left:72%;top:16%;background:#fff0a2;box-shadow:0 0 22px 10px rgba(255,224,126,.34),0 0 88px 34px rgba(255,180,68,.2)}
    .is-evening .celestial-body{left:80%;top:36%;background:#ffad5f;box-shadow:0 0 22px 10px rgba(255,153,71,.33),0 0 86px 34px rgba(255,103,44,.19)}
    .is-evening .sky-glow{left:48%;top:20%;width:64%;height:54%;background:radial-gradient(circle at 78% 58%,rgba(255,177,93,.55),rgba(255,116,70,.14) 28%,transparent 62%);filter:blur(13px);opacity:.75}
    .is-night .celestial-body{left:72%;top:12%;opacity:.82;background:#eef1e8;box-shadow:0 0 18px 6px rgba(210,220,229,.12),0 0 52px 18px rgba(176,194,214,.08)}
    .is-night .celestial-body:after{content:"";position:absolute;inset:0;border-radius:50%;background:transparent;transition:transform .8s ease,background .8s ease}
    .is-night.moon-half-right .celestial-body:after{background:#172231;transform:translateX(-50%)}
    .is-night.moon-half-left .celestial-body:after{background:#172231;transform:translateX(50%)}
    .is-night.moon-full .celestial-body:after{background:transparent;transform:none}
    .is-night.moon-dim .celestial-body{opacity:.38}.is-night.moon-dim .celestial-body:after{background:#172231;transform:translateX(-72%)}
    .app[data-weather="partly-cloudy"] .celestial-body{opacity:.58}.app[data-weather="cloudy"] .celestial-body{opacity:.16}.app[data-weather="rain"] .celestial-body,.app[data-weather="heavy-rain"] .celestial-body,.app[data-weather="storm"] .celestial-body,.app[data-weather="drizzle"] .celestial-body,.app[data-weather="fog"] .celestial-body{opacity:0}

    .left-zone{justify-content:flex-end;align-items:stretch}.music-corner{position:relative;width:min(32vw,440px);height:100%}.side-table{position:absolute;left:0;right:0;bottom:calc(var(--sill-line) - 22px);height:24px;border-radius:8px;background:linear-gradient(180deg,#785b45,#4a372c);box-shadow:0 11px 24px rgba(0,0,0,.32)}.side-table:before,.side-table:after{content:"";position:absolute;top:20px;width:16px;height:48vh;background:linear-gradient(90deg,#3a2b23,#654938,#34261f)}.side-table:before{left:8%}.side-table:after{right:8%}
    .table-books{position:absolute;left:7%;bottom:var(--sill-line);display:flex;flex-direction:column-reverse;align-items:flex-start;gap:0;z-index:3}.table-book{position:relative;flex:0 0 auto;height:18px;border:0;border-radius:3px 5px 2px 3px;padding:0;background:#6d5140;box-shadow:inset 0 2px rgba(255,255,255,.08),inset 0 -2px rgba(0,0,0,.16),0 2px 4px rgba(0,0,0,.22);cursor:default;transition:transform .18s ease}.table-book:nth-child(2){background:#51616a}.table-book:nth-child(3){background:#74654b}.table-book:nth-child(4){background:#5b4a62}.table-book:nth-child(5){background:#715b4b}.table-book.tall{width:118px;height:18px}.table-book.medium{width:104px;height:17px}.table-book.short{width:90px;height:16px}.table-book.enabled{cursor:pointer}.table-book.enabled:hover{transform:translateX(3px)}.table-book-label{position:absolute;left:9px;right:9px;top:50%;transform:translateY(-50%);font-size:7px;line-height:1;letter-spacing:.035em;color:rgba(255,255,255,.52);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
    .music-box{position:absolute;right:7%;bottom:var(--sill-line);width:178px;height:118px;border:0;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 12px 16px rgba(0,0,0,.3))}.music-base{position:absolute;left:8px;right:8px;bottom:0;height:62px;border-radius:8px 8px 11px 11px;background:linear-gradient(160deg,#865f3e,#573b29 66%,#3a281e);box-shadow:inset 0 2px rgba(255,255,255,.12),inset 0 -7px 12px rgba(0,0,0,.2)}.music-base:after{content:"";position:absolute;inset:9px 14px;border:1px solid rgba(233,190,126,.28);border-radius:5px}.music-lid{position:absolute;left:16px;right:16px;bottom:57px;height:52px;border-radius:9px 9px 4px 4px;background:linear-gradient(155deg,#9b714a,#63432e);transform-origin:50% 100%;transform:perspective(170px) rotateX(-39deg);box-shadow:inset 0 2px rgba(255,255,255,.13)}.music-stage{position:absolute;left:38px;right:38px;bottom:57px;height:18px;border-radius:9px;background:linear-gradient(180deg,#6a4c32,#3d2d22);box-shadow:0 0 0 3px #4d3528;overflow:hidden}.music-cylinder{position:absolute;left:55px;bottom:60px;width:67px;height:18px;border-radius:9px;background:repeating-linear-gradient(90deg,#d0b56f 0 3px,#9c7b3f 3px 5px,#d9bd72 5px 9px);border:2px solid #6c5230;box-shadow:inset 0 2px rgba(255,255,255,.18),0 2px 5px rgba(0,0,0,.3);animation:cylinder-turn 2.8s linear infinite}.music-cylinder:after{content:"";position:absolute;inset:3px;background:radial-gradient(circle at 14% 50%,#66502f 0 1px,transparent 1.5px),radial-gradient(circle at 36% 25%,#66502f 0 1px,transparent 1.5px),radial-gradient(circle at 58% 70%,#66502f 0 1px,transparent 1.5px),radial-gradient(circle at 82% 38%,#66502f 0 1px,transparent 1.5px)}.music-comb{position:absolute;left:62px;bottom:79px;width:54px;height:7px;background:repeating-linear-gradient(90deg,#c8b47f 0 2px,#6f654f 2px 3px);border-radius:2px;transform:skewX(-12deg)}.music-key{position:absolute;right:11px;bottom:27px;width:9px;height:3px;background:#b39b72;border-radius:3px;transform-origin:left center;animation:key-turn 2.4s linear infinite}.music-key:after{content:"";position:absolute;right:-6px;top:-4px;width:7px;height:7px;border:2px solid #b39b72;border-radius:50%}.music-box:not(.playing) .music-cylinder,.music-box:not(.playing) .music-key{animation-play-state:paused}@keyframes cylinder-turn{to{background-position:18px 0}}@keyframes key-turn{to{transform:rotate(360deg)}}.music-note{position:absolute;left:56%;bottom:130px;font-size:11px;color:rgba(244,220,177,.4);opacity:0}.music-box.playing .music-note{animation:note-rise 3.5s ease-out infinite}@keyframes note-rise{0%{opacity:0;transform:translateY(4px)}25%{opacity:.48}100%{opacity:0;transform:translate(-12px,-38px)}}
    .right-zone{justify-content:center;align-items:center}.photo-frame{--frame-accent-1:#d89a63;--frame-accent-2:#7db6d8;--frame-accent-3:#bd83b4;--frame-accent-4:#8cc5a0;position:relative;width:min(25vw,350px);aspect-ratio:4/5;border:15px solid #4b3529;border-radius:4px;background:#2b201a;box-shadow:0 22px 42px rgba(0,0,0,.36),inset 0 0 0 2px rgba(255,255,255,.05);padding:12px}.photo-frame.black{border-color:#1d1f22}.photo-frame.light{border-color:#b8aa95}.photo-frame-inner{position:relative;width:100%;height:100%;overflow:hidden;background:#efeae2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}.photo-frame.mat-off{padding:0}.frame-image,.frame-abstract,.frame-effects{position:absolute;inset:0}.frame-image{width:100%;height:100%;object-fit:cover;display:none}.frame-image.show{display:block}.frame-abstract{background:radial-gradient(circle at 18% 18%,color-mix(in srgb,var(--frame-accent-1) 75%,white 25%) 0 9%,transparent 30%),radial-gradient(circle at 80% 22%,color-mix(in srgb,var(--frame-accent-2) 72%,white 28%) 0 12%,transparent 34%),radial-gradient(circle at 34% 75%,color-mix(in srgb,var(--frame-accent-3) 68%,white 32%) 0 15%,transparent 37%),radial-gradient(circle at 78% 78%,color-mix(in srgb,var(--frame-accent-4) 65%,white 35%) 0 12%,transparent 34%),linear-gradient(145deg,#eadfcf,#c8d7d5 46%,#d9c7d4);filter:saturate(.9)}.frame-abstract:before{content:"";position:absolute;left:-10%;top:39%;width:120%;height:20%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.26),transparent);transform:rotate(-12deg);filter:blur(12px)}.frame-effects{pointer-events:none;overflow:hidden}.frame-particle{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--particle-color);opacity:.42;filter:blur(.2px);animation:frame-float var(--particle-speed) ease-in-out infinite alternate}.frame-glow{position:absolute;inset:-18%;background:radial-gradient(circle at 20% 20%,var(--frame-accent-1),transparent 26%),radial-gradient(circle at 82% 30%,var(--frame-accent-2),transparent 28%),radial-gradient(circle at 55% 85%,var(--frame-accent-3),transparent 30%);filter:blur(30px);opacity:.12;animation:frame-glow 10s ease-in-out infinite alternate}.frame-sheen{position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.18) 48%,transparent 61%);transform:translateX(-70%);animation:frame-sheen 9s ease-in-out infinite}.photo-frame[data-effect="none"] .frame-effects{display:none}@keyframes frame-float{from{transform:translate3d(0,8px,0) scale(.85)}to{transform:translate3d(7px,-14px,0) scale(1.1)}}@keyframes frame-glow{to{transform:translate(4%,-3%) scale(1.08)}}@keyframes frame-sheen{0%,55%{transform:translateX(-75%)}85%,100%{transform:translateX(75%)}}
    .room-dots{display:none;position:absolute;z-index:22;left:50%;bottom:20px;transform:translateX(-50%);gap:8px}.room-dot{width:7px;height:7px;border:0;border-radius:50%;padding:0;background:rgba(255,255,255,.28)}.room-dot.active{background:rgba(255,255,255,.82)}
    .roof-detail{position:absolute;display:block;pointer-events:none}.antenna{left:50%;top:-18px;width:2px;height:18px;background:#454f58;transform:translateX(-50%)}.antenna:after{content:"";position:absolute;left:50%;top:-2px;width:5px;height:5px;border-radius:50%;background:#505b65;transform:translateX(-50%)}.dish{right:12%;top:-9px;width:13px;height:7px;border:2px solid #46515b;border-top:0;border-radius:0 0 12px 12px;transform:rotate(-18deg)}.dish:after{content:"";position:absolute;left:5px;bottom:-5px;width:2px;height:5px;background:#46515b}.tank{left:12%;top:-7px;width:14px;height:8px;border-radius:3px;background:#3d4750}.utility{right:14%;top:-8px;width:16px;height:8px;background:#3b454d;border-radius:2px}
    @media (max-width:900px),(pointer:coarse),(hover:none){.room-wall{inset:0;border-radius:0}.room-track{--sill-line:12vh;display:flex;align-items:stretch;gap:0;padding:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}.room-track.drawing-fog{overflow-x:hidden;scroll-snap-type:none}.room-track::-webkit-scrollbar{display:none}.room-zone{flex:0 0 100%;height:100%;scroll-snap-align:start;padding:10vh 5vw 8vh}.left-zone,.right-zone{justify-content:center}.main-zone{padding-top:12vh}.music-corner{width:min(94vw,440px);height:100%}.side-table{left:1%;right:1%}.table-books{left:6%;transform:scale(.94);transform-origin:left bottom}.music-box{right:6%}.photo-frame{width:min(72vw,380px);max-height:72vh}.window-recess{padding:13px 13px 19px;border-radius:22px}.window-shell:after{left:-17px!important;right:-17px!important;bottom:-14px!important;height:14px!important}.room-light{width:145vw!important;height:58vh!important;top:-5vh!important}.ceiling-lamp{top:-1vh}.window-blinds{left:4px;right:4px;top:4px}.blind-headrail{height:27px}.blind-sheet{top:24px;left:9px;right:9px}.blind-chain{top:27px;right:9px}.room-dots{display:flex}.celestial-body{width:40px;height:40px}}
  </style>
</head>
<body>
  <main class="app is-night" id="app">
    <header class="brand"><strong>Window</strong><button class="weather-chip" id="weatherToggle" type="button" aria-expanded="false" aria-controls="weatherPanel"><span id="weatherLabel">Sabah · loading weather</span><span class="weather-chevron" aria-hidden="true">⌄</span></button></header>
    <section class="weather-panel" id="weatherPanel" hidden aria-label="Weather details"><div class="weather-card"><div class="weather-card-head"><div><strong id="weatherPlace">Sabah · Kota Kinabalu</strong><span id="weatherCondition">Loading weather…</span></div><button id="weatherClose" type="button" aria-label="Close weather details">×</button></div><div class="weather-temp-row"><strong id="weatherTemp">--°C</strong><span id="weatherFeels">Feels --°C</span></div><div class="weather-grid"><div><span>Cloud</span><strong id="weatherCloud">--%</strong></div><div><span>Rain now</span><strong id="weatherRain">-- mm</strong></div><div><span>Humidity</span><strong id="weatherHumidity">--%</strong></div><div><span>Wind</span><strong id="weatherWind">-- km/h</strong></div></div><div class="weather-card-foot"><span id="weatherUpdated">Updated --</span><button id="weatherLocationButton" type="button">Change location</button></div></div></section>
    <section class="room" aria-label="A quiet room overlooking the city">
      <div class="room-wall"><div class="room-light" aria-hidden="true"></div><div class="room-track" id="roomTrack">
        <section class="room-zone left-zone" data-room-page="left" aria-label="Music box table"><div class="music-corner"><div class="side-table"></div><div class="table-books" id="tableBooks"><button class="table-book" data-book-id="book-1"><span class="table-book-label"></span></button><button class="table-book" data-book-id="book-2"><span class="table-book-label"></span></button><button class="table-book" data-book-id="book-3"><span class="table-book-label"></span></button><button class="table-book" data-book-id="book-4"><span class="table-book-label"></span></button><button class="table-book" data-book-id="book-5"><span class="table-book-label"></span></button></div><button class="music-box" id="musicBox" type="button" aria-pressed="false" aria-label="Start the music box"><span class="music-lid"></span><span class="music-stage"></span><span class="music-cylinder"></span><span class="music-comb"></span><span class="music-base"></span><span class="music-key"></span><span class="music-note">♪</span></button></div></section>
        <section class="room-zone main-zone" data-room-page="main" aria-label="Weather window">
          <button class="ceiling-lamp" id="lampButton" type="button" aria-label="Toggle ceiling lamp" aria-pressed="true"><span class="lamp-canopy"></span><span class="lamp-cord"></span><span class="lamp-socket"></span><span class="lamp-shade"></span></button>
          <div class="window-recess"><button class="window-blinds" id="blindButton" type="button" aria-label="Adjust blinds" aria-pressed="false"><span class="blind-headrail"></span><span class="blind-sheet"></span><span class="blind-chain"></span></button><section class="window-shell" aria-label="Two-panel weather window"><div class="window-scene" id="windowScene"><div class="sky" aria-hidden="true"><div class="sky-glow"></div><div class="celestial-body" id="celestialBody"></div><div class="cloud cloud-a"></div><div class="cloud cloud-b"></div><div class="cloud cloud-c"></div></div><div class="skyline far" aria-hidden="true"><i class="bldg f1"></i><i class="bldg f2"><span class="roof-detail tank"></span></i><i class="bldg f3"></i><i class="bldg f4"><span class="roof-detail antenna"></span></i><i class="bldg f5"></i></div><div class="skyline mid" aria-hidden="true"><i class="bldg m1 tower-light"><span class="roof-detail antenna"></span></i><i class="bldg m2"><span class="roof-detail dish"></span></i><i class="bldg m3 tower-light"><span class="roof-detail utility"></span></i><i class="bldg m4"><span class="roof-detail tank"></span></i></div><div class="skyline near" aria-hidden="true"><i class="bldg n1"></i><i class="bldg n2 tower-light"><span class="roof-detail dish"></span></i><i class="bldg n3"><span class="roof-detail utility"></span></i></div><div class="haze" aria-hidden="true"></div><canvas id="rainCanvas" aria-hidden="true"></canvas><div class="lightning" id="lightning" aria-hidden="true"></div><canvas id="fogCanvas" aria-label="Glass. Drag to write or draw when condensation is visible."></canvas><div class="glass-reflection" aria-hidden="true"></div><div class="window-bars" aria-hidden="true"><i class="bar-v"></i></div><div class="hint" id="hint">Draw on the glass</div></div></section></div>
        </section>
        <section class="room-zone right-zone" data-room-page="right" aria-label="Photo frame"><div class="photo-frame" id="photoFrame" data-effect="particles"><div class="photo-frame-inner" id="photoFrameInner"><div class="frame-abstract" id="frameAbstract"></div><img class="frame-image" id="frameImage" alt=""><div class="frame-effects" id="frameEffects"><div class="frame-glow"></div><div class="frame-sheen"></div></div></div></div></section>
      </div></div>
      <div class="room-dots" id="roomDots"><button class="room-dot" data-page="0" aria-label="Music box"></button><button class="room-dot active" data-page="1" aria-label="Window"></button><button class="room-dot" data-page="2" aria-label="Photo frame"></button></div>
    </section>
    <nav class="control-dock" id="controlDock" aria-label="Window controls"><div class="control-items" id="controlItems"><button id="lampControl" type="button">Lamp · On</button><button id="clearButton" type="button">Fog · Off</button><button id="placeButton" type="button">Location</button></div><button class="dock-toggle" id="dockToggle" type="button" aria-label="Open controls" aria-expanded="false"><span></span><span></span><span></span><span></span></button></nav>
    <section class="place-panel" id="placePanel" aria-label="Weather location" hidden><div class="place-card"><div class="place-head"><strong>Weather location</strong><button id="closePlace" type="button" aria-label="Close location">×</button></div><label>Country<select id="countrySelect"></select></label><label>Location<select id="locationSelect"></select></label><div class="weather-meta" id="weatherMeta">Weather cache refreshes every 6 hours.</div></div></section>
    <footer class="source-note">Weather data: Open-Meteo · cached by this site</footer>
  </main>
  <script src="app.js"></script>
  <script src="touch-layout.js"></script>
  <script>
    function updateCelestialTime(){
      const app=document.getElementById('app');
      const hour=new Date().getHours();
      app.classList.remove('is-midday','is-afternoon','is-evening','moon-full','moon-half-left','moon-half-right','moon-dim');
      if(hour>=11&&hour<14) app.classList.add('is-midday');
      else if(hour>=14&&hour<17.5) app.classList.add('is-afternoon');
      else if(hour>=17.5&&hour<19) app.classList.add('is-evening');
      if(hour>=19||hour<6){
        const synodic=29.53058867;
        const epoch=Date.UTC(2000,0,6,18,14,0);
        let age=((Date.now()-epoch)/86400000)%synodic;
        if(age<0) age+=synodic;
        const phase=age/synodic;
        if(phase>=.43&&phase<=.57) app.classList.add('moon-full');
        else if(phase>=.18&&phase<=.32) app.classList.add('moon-half-right');
        else if(phase>=.68&&phase<=.82) app.classList.add('moon-half-left');
        else app.classList.add('moon-dim');
      }
    }
    updateCelestialTime();
    setInterval(updateCelestialTime,60000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateCelestialTime()});
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' }).then(reg => reg.update()).catch(() => {});
      });
    }
  </script>
